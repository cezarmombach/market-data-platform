# Lint settings are pinned here so the result does not depend on the ruff version.
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "data"]

[lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "DTZ"]

[lint.per-file-ignores]
# Tests create naive datetimes on purpose, to check that they are rejected
"tests/*" = ["DTZ001"]
